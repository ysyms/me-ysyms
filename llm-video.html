<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<link rel="icon" href="logo.png" type="image/png">
<title>LLM 原理动画讲解 | YSYMS</title>
<meta name="description" content="用一段纯 HTML/CSS/JS 动画，三分钟讲清大语言模型（LLM）的工作原理：分词、词嵌入、注意力、Transformer、采样、自回归生成与训练。">
<style>
    :root {
        --bg: #070b16;
        --panel: #0f1629;
        --ink: #e6ecff;
        --muted: #8a96b8;
        --blue: #3b82f6;
        --blue2: #60a5fa;
        --violet: #a78bfa;
        --pink: #f472b6;
        --green: #34d399;
        --amber: #fbbf24;
        --red: #f87171;
        --line: rgba(148, 163, 255, 0.18);
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    html, body { margin: 0; min-height: 100%; }

    body {
        background: #03050b;
        color: var(--ink);
        font-family: Inter, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, -apple-system, sans-serif;
        -webkit-font-smoothing: antialiased;
        padding: 16px;
        padding-bottom: calc(24px + env(safe-area-inset-bottom));
    }

    .wrap { width: 100%; max-width: 1100px; margin: 0 auto; }

    .top { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
    .top h1 { font-size: 1.15rem; margin: 0; font-weight: 800; letter-spacing: -0.01em; }
    .top a { color: var(--muted); text-decoration: none; font-size: 0.85rem; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; }
    .top a:hover { color: var(--blue2); }

    /* ---------- player ---------- */
    .player { position: relative; width: 100%; background: #000; border-radius: 14px; overflow: hidden; box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255, 255, 255, 0.06); user-select: none; -webkit-user-select: none; }
    .viewport { position: relative; width: 100%; aspect-ratio: 16 / 9; overflow: hidden; background: var(--bg); cursor: pointer; }
    .player:fullscreen { display: flex; flex-direction: column; border-radius: 0; max-width: none; }
    .player:fullscreen .viewport { flex: 1; aspect-ratio: auto; }

    .stage { position: absolute; left: 0; top: 0; width: 1280px; height: 720px; transform-origin: 0 0; overflow: hidden;
        background: radial-gradient(ellipse at 50% 0%, #121c3a 0%, var(--bg) 60%); }
    .stage::before { content: ""; position: absolute; inset: 0; pointer-events: none;
        background-image: linear-gradient(var(--line) 1px, transparent 1px), linear-gradient(90deg, var(--line) 1px, transparent 1px);
        background-size: 64px 64px; opacity: 0.18; mask-image: radial-gradient(ellipse at center, #000 30%, transparent 75%); -webkit-mask-image: radial-gradient(ellipse at center, #000 30%, transparent 75%); }

    .overlay { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; background: rgba(3, 5, 11, 0.55); backdrop-filter: blur(2px); transition: opacity 0.3s; z-index: 5; }
    .overlay.hidden { opacity: 0; pointer-events: none; }
    .bigplay { width: 84px; height: 84px; border-radius: 50%; border: none; background: linear-gradient(135deg, var(--blue), #7c3aed); color: #fff; display: grid; place-items: center; cursor: pointer; box-shadow: 0 10px 40px rgba(59, 130, 246, 0.5); transition: transform 0.25s; }
    .bigplay:hover { transform: scale(1.08); }
    .overlay .hint { color: #c7d2fe; font-size: 0.9rem; text-align: center; padding: 0 16px; }

    .controls { display: flex; align-items: center; gap: 10px; padding: 10px 14px; background: #0b0f1c; border-top: 1px solid rgba(255, 255, 255, 0.06); }
    .cbtn { flex-shrink: 0; height: 32px; min-width: 32px; padding: 0 8px; border: none; border-radius: 8px; background: transparent; color: #cbd5e1; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 4px; font: 600 12px/1 inherit; font-family: inherit; }
    .cbtn:hover { background: rgba(255, 255, 255, 0.08); color: #fff; }
    .cbtn.on { color: var(--blue2); }
    .time { font: 500 12px/1 ui-monospace, SFMono-Regular, Menlo, monospace; color: #94a3b8; flex-shrink: 0; min-width: 84px; }

    .bar { position: relative; flex: 1; height: 22px; cursor: pointer; touch-action: none; }
    .bar-track { position: absolute; left: 0; right: 0; top: 9px; height: 4px; border-radius: 4px; background: rgba(255, 255, 255, 0.14); overflow: hidden; }
    .bar-fill { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: linear-gradient(90deg, var(--blue), var(--violet)); }
    .bar-tick { position: absolute; top: 7px; width: 2px; height: 8px; background: #0b0f1c; }
    .bar-knob { position: absolute; top: 4px; width: 14px; height: 14px; margin-left: -7px; border-radius: 50%; background: #fff; box-shadow: 0 0 0 3px rgba(96, 165, 250, 0.35); transform: scale(0); transition: transform 0.15s; }
    .bar:hover .bar-knob, .bar.drag .bar-knob { transform: scale(1); }
    .bar-tip { position: absolute; bottom: 26px; transform: translateX(-50%); white-space: nowrap; padding: 4px 8px; border-radius: 6px; background: #1e293b; color: #e2e8f0; font-size: 12px; opacity: 0; pointer-events: none; transition: opacity 0.15s; }
    .bar:hover .bar-tip { opacity: 1; }

    .chapters { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
    .chap { border: 1px solid rgba(255, 255, 255, 0.08); background: #0b1020; color: #94a3b8; border-radius: 999px; padding: 6px 12px; font: 600 12.5px/1.2 inherit; font-family: inherit; cursor: pointer; transition: all 0.2s; }
    .chap b { color: #64748b; font-weight: 700; margin-right: 4px; font-family: ui-monospace, Menlo, monospace; }
    .chap:hover { color: #e2e8f0; border-color: rgba(96, 165, 250, 0.4); }
    .chap.active { color: #fff; background: rgba(59, 130, 246, 0.18); border-color: rgba(96, 165, 250, 0.6); }
    .chap.active b { color: var(--blue2); }
    .foot { margin-top: 14px; color: #64748b; font-size: 12px; line-height: 1.6; }
    .foot kbd { font-family: ui-monospace, Menlo, monospace; background: #111827; border: 1px solid #1f2937; border-radius: 4px; padding: 0 4px; color: #94a3b8; }

    @media (max-width: 560px) {
        body { padding: 10px; }
        .controls { gap: 4px; padding: 8px; }
        .time { min-width: 0; font-size: 11px; }
        .cbtn .lbl { display: none; }
    }

    /* ---------- stage content (1280×720 coordinate space) ---------- */
    .scene { position: absolute; inset: 0; }
    .abs { position: absolute; }
    .center { text-align: center; }
    .hd { position: absolute; left: 64px; top: 44px; display: flex; align-items: baseline; gap: 16px; }
    .hd .n { font: 800 20px/1 ui-monospace, Menlo, monospace; color: var(--blue2); padding: 6px 10px; border-radius: 8px; background: rgba(96, 165, 250, 0.12); }
    .hd .t { font-size: 34px; font-weight: 800; letter-spacing: -0.01em; }
    .note { position: absolute; left: 0; right: 0; text-align: center; font-size: 26px; color: #c7d2fe; }
    .hl { color: var(--amber); }
    .panel { background: rgba(15, 22, 41, 0.85); border: 1.5px solid rgba(148, 163, 255, 0.22); border-radius: 18px; }
    .lbl { font-size: 15px; color: var(--muted); letter-spacing: 0.08em; }
    .sub { position: absolute; left: 50%; bottom: 26px; transform: translateX(-50%); max-width: 1120px; width: max-content; padding: 9px 20px; border-radius: 10px; background: rgba(0, 0, 0, 0.66); color: #fff; font-size: 27px; line-height: 1.4; text-align: center; transition: opacity 0.25s; z-index: 4; }
    .sub.off, .sub:empty { opacity: 0; }
    .ovl { position: absolute; left: 0; top: 0; pointer-events: none; overflow: visible; }

    .pt { position: absolute; left: 0; top: 0; color: #93c5fd; font-family: ui-monospace, Menlo, monospace; white-space: nowrap; }
    .glow { position: absolute; border-radius: 50%; background: radial-gradient(circle, rgba(124, 58, 237, 0.35), rgba(59, 130, 246, 0.12) 45%, transparent 70%); filter: blur(20px); }
    .kicker { display: inline-block; font-size: 18px; font-weight: 700; letter-spacing: 0.3em; color: var(--blue2); padding: 8px 16px; border: 1px solid rgba(96, 165, 250, 0.4); border-radius: 999px; }
    .title { font-size: 80px; font-weight: 900; line-height: 1.12; letter-spacing: -0.02em; background: linear-gradient(135deg, #fff 20%, #a5b4fc 60%, #f0abfc); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .tagline { font-size: 28px; color: #c7d2fe; }

    .arrow { position: absolute; height: 3px; background: linear-gradient(90deg, rgba(96, 165, 250, 0), var(--blue2)); }
    .arrow::after { content: ""; position: absolute; right: -4px; top: -6px; border-left: 13px solid var(--blue2); border-top: 7.5px solid transparent; border-bottom: 7.5px solid transparent; }
    .llm { display: flex; align-items: center; justify-content: center; font-size: 36px; font-weight: 900; letter-spacing: 0.04em; border-radius: 22px; background: linear-gradient(135deg, #1e3a8a, #5b21b6); border: 1.5px solid rgba(167, 139, 250, 0.7); }
    .big { font-size: 46px; font-weight: 700; margin-top: 14px; white-space: nowrap; }
    .caret { display: inline-block; width: 3px; height: 44px; background: var(--blue2); vertical-align: -6px; margin-left: 4px; }

    .barrow { display: flex; align-items: center; gap: 14px; height: 58px; transition: opacity 0.3s; }
    .barrow .w { width: 84px; text-align: right; font-size: 30px; font-weight: 700; }
    .barrow .track { position: relative; width: 250px; height: 26px; border-radius: 6px; background: rgba(255, 255, 255, 0.06); overflow: hidden; }
    .barrow .fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 6px; background: linear-gradient(90deg, var(--blue), var(--violet)); }
    .barrow .pct { font: 600 22px/1 ui-monospace, Menlo, monospace; color: #cbd5e1; width: 70px; }
    .barrow.win .fill { background: linear-gradient(90deg, #f59e0b, var(--amber)); }
    .barrow.win .w { color: var(--amber); }

    .tokrow { display: flex; justify-content: center; align-items: flex-start; }
    .tk { display: inline-flex; flex-direction: column; align-items: center; }
    .tw { font-size: 52px; font-weight: 700; border: 2px solid transparent; border-radius: 12px; white-space: nowrap; }
    .tid { margin-top: 12px; font: 600 22px/1 ui-monospace, Menlo, monospace; color: #94a3b8; }

    .chip { display: inline-flex; align-items: center; justify-content: center; padding: 10px 16px; border-radius: 12px; font-size: 30px; font-weight: 700; background: rgba(96, 165, 250, 0.12); border: 2px solid rgba(96, 165, 250, 0.45); white-space: nowrap; }
    .vec { font: 600 22px/1 ui-monospace, Menlo, monospace; }
    .vrow { display: flex; align-items: center; gap: 10px; height: 34px; }
    .vrow .num { width: 78px; text-align: right; color: #cbd5e1; }
    .vrow .vb { height: 14px; border-radius: 4px; }

    .card { position: absolute; padding: 20px 22px; border-radius: 18px; background: rgba(15, 22, 41, 0.9); border: 1.5px solid rgba(148, 163, 255, 0.25); }
    .card h3 { margin: 0 0 8px; font-size: 26px; }
    .card p { margin: 0; font-size: 20px; color: #a5b4d8; line-height: 1.5; }
    .badge { display: inline-block; font: 800 16px/1 ui-monospace, Menlo, monospace; padding: 6px 10px; border-radius: 8px; margin-bottom: 12px; }

    .layer { position: absolute; display: flex; gap: 10px; padding: 8px; border-radius: 14px; background: rgba(30, 41, 79, 0.65); border: 1.5px solid rgba(148, 163, 255, 0.3); }
    .layer .ln { width: 74px; display: flex; align-items: center; font-size: 17px; color: var(--muted); font-weight: 700; }
    .layer .sb { flex: 1; display: flex; align-items: center; justify-content: center; border-radius: 9px; font-size: 19px; font-weight: 700; }
    .fact { display: flex; align-items: flex-start; gap: 14px; font-size: 25px; line-height: 1.45; margin-bottom: 22px; }
    .fact i { flex-shrink: 0; width: 12px; height: 12px; border-radius: 50%; margin-top: 12px; }

    .slider { position: absolute; height: 8px; border-radius: 8px; background: linear-gradient(90deg, #38bdf8, #a78bfa, #f43f5e); }
    .knob { position: absolute; top: -10px; width: 28px; height: 28px; margin-left: -14px; border-radius: 50%; background: #fff; box-shadow: 0 0 0 5px rgba(255, 255, 255, 0.2); }

    .gtok { display: inline-block; padding: 2px 4px; margin: 0 1px; border-radius: 6px; }
    .gtok.new { background: rgba(251, 191, 36, 0.28); color: #fde68a; }
    .eos { display: inline-block; font: 700 18px/1 ui-monospace, Menlo, monospace; color: #fca5a5; border: 1.5px solid #f87171; border-radius: 6px; padding: 5px 8px; margin-left: 8px; vertical-align: 4px; }
    .flow { display: flex; align-items: center; justify-content: center; gap: 10px; }
    .flow .chip { font-size: 25px; padding: 12px 16px; }
    .flow .ar { color: var(--blue2); font-size: 26px; font-weight: 900; }
</style>
</head>
<body>
<div class="wrap">
    <div class="top">
        <h1>三分钟看懂大语言模型（LLM）</h1>
        <a href="/">
            <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M19 12H5M12 5l-7 7 7 7"></path></svg>
            返回首页
        </a>
    </div>

    <div class="player" id="player">
        <div class="viewport" id="viewport">
            <div class="stage" id="stage">
                <div class="sub" id="sub"></div>
            </div>
            <div class="overlay" id="overlay">
                <button class="bigplay" id="bigplay" aria-label="播放">
                    <svg width="34" height="34" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l11-6.5a1 1 0 0 0 0-1.72l-11-6.5A1 1 0 0 0 8 5.5z"/></svg>
                </button>
                <div class="hint" id="hint">点击播放 · 可开启语音解说</div>
            </div>
        </div>
        <div class="controls">
            <button class="cbtn" id="playBtn" aria-label="播放/暂停"></button>
            <span class="time" id="time">0:00 / 0:00</span>
            <div class="bar" id="bar">
                <div class="bar-track"><div class="bar-fill" id="barFill"></div></div>
                <div class="bar-knob" id="barKnob"></div>
                <div class="bar-tip" id="barTip"></div>
            </div>
            <button class="cbtn" id="narrBtn" title="语音解说 (N)">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path class="wave" d="M15.5 8.5a5 5 0 0 1 0 7M19 5a10 10 0 0 1 0 14"/></svg>
                <span class="lbl">解说</span>
            </button>
            <button class="cbtn on" id="ccBtn" title="字幕 (C)">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="5" width="20" height="14" rx="3"/><path d="M10 10.5a2 2 0 1 0 0 3M17 10.5a2 2 0 1 0 0 3" stroke-linecap="round"/></svg>
                <span class="lbl">字幕</span>
            </button>
            <button class="cbtn" id="fsBtn" title="全屏 (F)" aria-label="全屏">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
            </button>
        </div>
    </div>

    <div class="chapters" id="chapters"></div>
    <div class="foot">
        纯 HTML + CSS + JavaScript 绘制，无视频文件。快捷键：<kbd>空格</kbd> 播放/暂停 · <kbd>←</kbd><kbd>→</kbd> 快退/快进 5 秒 · <kbd>N</kbd> 语音解说 · <kbd>C</kbd> 字幕 · <kbd>F</kbd> 全屏。<br>
        语音解说使用浏览器自带的语音合成，效果取决于系统是否安装中文语音。图中数值均为示意，并非真实模型输出。
    </div>
</div>

<script>
(() => {
    // ---------- helpers ----------
    const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
    const ease = x => x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
    const P = (t, a, b) => ease(clamp((t - a) / (b - a)));
    const lerp = (a, b, k) => a + (b - a) * k;
    const NS = 'http://www.w3.org/2000/svg';
    const COL = ['#60a5fa', '#a78bfa', '#f472b6', '#34d399', '#fbbf24', '#22d3ee', '#fb923c'];

    function el(parent, tag, cls, html, css) {
        const e = document.createElement(tag);
        if (cls) e.className = cls;
        if (html != null) e.innerHTML = html;
        if (css) e.style.cssText = css;
        if (parent) parent.appendChild(e);
        return e;
    }
    function sv(parent, tag, attrs) {
        const e = document.createElementNS(NS, tag);
        for (const k in attrs) e.setAttribute(k, attrs[k]);
        if (parent) parent.appendChild(e);
        return e;
    }
    function svgRoot(parent) {
        const s = sv(parent, 'svg', { width: 1280, height: 720, viewBox: '0 0 1280 720', class: 'ovl' });
        const defs = sv(s, 'defs', {});
        [['ah', '#60a5fa'], ['ahp', '#f472b6'], ['ahg', '#34d399'], ['aha', '#fbbf24']].forEach(([id, c]) => {
            const m = sv(defs, 'marker', { id, viewBox: '0 0 10 10', refX: 8, refY: 5, markerWidth: 7, markerHeight: 7, orient: 'auto-start-reverse' });
            sv(m, 'path', { d: 'M0 0L10 5L0 10z', fill: c });
        });
        return s;
    }
    function rgba(hex, a) {
        const n = parseInt(hex.slice(1), 16);
        return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${a})`;
    }
    function show(e, k, dy = 20) {
        e.style.opacity = k;
        e.style.transform = k >= 1 ? '' : `translateY(${(1 - k) * dy}px)`;
    }
    function pop(e, k) {
        e.style.opacity = clamp(k * 1.5);
        e.style.transform = `scale(${lerp(0.6, 1, k)})`;
    }
    // draw an SVG path progressively; marker (arrow head) appears at the end
    function draw(path, k, marker) {
        path.style.strokeDashoffset = 1 - k;
        path.style.opacity = k > 0.001 ? 1 : 0;
        if (marker) {
            if (k > 0.97) path.setAttribute('marker-end', `url(#${marker})`);
            else path.removeAttribute('marker-end');
        }
    }
    function line(svg, d, color, width, extra = {}) {
        return sv(svg, 'path', Object.assign({ d, fill: 'none', stroke: color, 'stroke-width': width, 'stroke-linecap': 'round', pathLength: 1, 'stroke-dasharray': '1 1' }, extra));
    }
    function header(r, n, t) {
        return el(r, 'div', 'hd', `<span class="n">${n}</span><span class="t">${t}</span>`);
    }
    function mulberry(a) {
        return () => {
            a |= 0; a = a + 0x6D2B79F5 | 0;
            let t = Math.imul(a ^ a >>> 15, 1 | a);
            t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
            return ((t ^ t >>> 14) >>> 0) / 4294967296;
        };
    }
    // centre of an element in stage coordinates (layout values, unaffected by the stage scale)
    function centerOf(e, root) {
        let x = e.offsetWidth / 2, y = e.offsetHeight / 2, n = e;
        while (n && n !== root) { x += n.offsetLeft; y += n.offsetTop; n = n.offsetParent; }
        return { x, y, w: e.offsetWidth, h: e.offsetHeight };
    }

    // ---------- scenes ----------
    // Each scene: build(root) creates DOM once; update(state, t) sets everything from local time t,
    // so the timeline can be scrubbed to any point deterministically.
    const scenes = [
        {
            title: '开场',
            dur: 10,
            cues: [
                [0.6, '你每天可能都在和 ChatGPT、Claude 这样的 AI 对话。'],
                [5.2, '它们到底是怎么工作的？我们用三分钟讲清楚。'],
            ],
            build(r) {
                const s = { parts: [] };
                const rnd = mulberry(7);
                const words = ['the', '猫', '学习', 'token', 'AI', '的', 'model', '你好', 'is', '##ing', '注意力', 'vector', '了', 'data', '神经', '<eos>', 'language', '预测', '概率', 'GPT', '我', 'world', '模型', '中', 'Q·K', 'softmax'];
                s.glow = el(r, 'div', 'glow', '', 'left:290px;top:90px;width:700px;height:540px');
                for (let i = 0; i < 40; i++) {
                    const e = el(r, 'div', 'pt', words[i % words.length]);
                    e.style.fontSize = (14 + rnd() * 22).toFixed(0) + 'px';
                    s.parts.push({ e, x: rnd() * 1240, y: rnd() * 720, sp: 8 + rnd() * 22, ph: rnd() * 6.28, o: 0.12 + rnd() * 0.25 });
                }
                s.k = el(r, 'div', 'abs center', '<span class="kicker">AI 科普 · 动画讲解</span>', 'left:0;right:0;top:190px');
                s.t = el(r, 'div', 'abs center title', '大语言模型<br>是怎么工作的？', 'left:0;right:0;top:260px');
                s.st = el(r, 'div', 'abs center tagline', '从「预测下一个词」到 ChatGPT', 'left:0;right:0;top:475px');
                return s;
            },
            update(s, t) {
                s.parts.forEach(p => {
                    const y = ((p.y - t * p.sp) % 760 + 760) % 760 - 20;
                    const x = p.x + Math.sin(t * 0.5 + p.ph) * 18;
                    p.e.style.transform = `translate(${x}px,${y}px)`;
                    p.e.style.opacity = p.o * P(t, 0, 1.5);
                });
                s.glow.style.opacity = 0.6 + 0.25 * Math.sin(t * 1.4);

            }
            lastTs = ts;
            if (T >= total) { T = total; pause(); ended = true; showOverlay(true); }
            render();
        }
        requestAnimationFrame(loop);
    }

    function setPlayIcon() { playBtn.innerHTML = playing ? ICON_PAUSE : ICON_PLAY; }
    function showOverlay(end) {
        bigplay.innerHTML = end ? ICON_REPLAY : BIG_PLAY;
        document.getElementById('hint').textContent = end ? '重新播放' : '点击播放 · 可开启语音解说';
        overlay.classList.remove('hidden');
    }
    function play() {
        if (ended || T >= total) { T = 0; ended = false; }
        playing = true; lastTs = null; cueKey = null;
        overlay.classList.add('hidden');
        setPlayIcon();
    }
    function pause() { playing = false; hush(); setPlayIcon(); }
    function toggle() { playing ? pause() : play(); }
    function seek(t) {
        T = clamp(t, 0, total); ended = false;
        hush(); cueKey = null;
        if (!playing && T < total) overlay.classList.add('hidden');
        render();
    }

    viewport.addEventListener('click', toggle);
    playBtn.onclick = toggle;
    narrBtn.onclick = () => {
        narrate = !narrate;
        narrBtn.classList.toggle('on', narrate);
        if (!narrate) hush();
        else if (!hasTTS) alert('当前浏览器不支持语音合成。');
        else if (playing) cueKey = null;
    };
    ccBtn.onclick = () => { captions = !captions; ccBtn.classList.toggle('on', captions); render(); };
    const player = document.getElementById('player');
    fsBtn.onclick = () => {
        if (document.fullscreenElement) document.exitFullscreen();
        else if (player.requestFullscreen) player.requestFullscreen();
        else if (player.webkitRequestFullscreen) player.webkitRequestFullscreen();
    };

    // scrubbing
    const posToTime = e => {
        const r = bar.getBoundingClientRect();
        return clamp((e.clientX - r.left) / r.width) * total;
    };
    let dragging = false;
    bar.addEventListener('pointerdown', e => { dragging = true; bar.classList.add('drag'); bar.setPointerCapture(e.pointerId); seek(posToTime(e)); });
    bar.addEventListener('pointermove', e => {
        const t = posToTime(e);
        const r = bar.getBoundingClientRect();
        barTip.style.left = (e.clientX - r.left) + 'px';
        barTip.textContent = `${fmt(t)} · ${scenes[sceneIndex(Math.min(t, total - 1e-3))].title}`;
        if (dragging) seek(t);
    });
    const endDrag = () => { dragging = false; bar.classList.remove('drag'); };
    bar.addEventListener('pointerup', endDrag);
    bar.addEventListener('pointercancel', endDrag);

    document.addEventListener('keydown', e => {
        if (e.target.closest && e.target.closest('input,textarea')) return;
        const k = e.key.toLowerCase();
        if (k === ' ' || k === 'k') { e.preventDefault(); toggle(); }
        else if (k === 'arrowright') { e.preventDefault(); seek(T + 5); }
        else if (k === 'arrowleft') { e.preventDefault(); seek(T - 5); }
        else if (k === 'f') fsBtn.onclick();
        else if (k === 'n') narrBtn.onclick();
        else if (k === 'c') ccBtn.onclick();
    });

    setPlayIcon();
    render();
    requestAnimationFrame(loop);
    window.__llmVideo = { seek, scenes, starts, total };
})();
</script>
</body>
</html>
